<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Free to Take</title>
<style>
  body{margin:0;background:#F2F2F7;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#111}
  main{max-width:420px;margin:0 auto;padding:56px 16px 32px}
  h1{font-size:32px;margin:0 0 8px} p{font-size:15px;line-height:1.4;margin:0 0 20px;color:#333}
  .card{background:#fff;border-radius:12px;padding:24px 16px;text-align:center;margin-bottom:16px}
  .btn{display:block;text-align:center;background:#D4FF00;color:#111;font-weight:600;text-decoration:none;padding:12px;border-radius:8px;border:1px solid #111}
  .muted{font-size:13px;color:#777;margin-top:16px}
</style></head>
<body><main>
  <h1 id="t">Checking your link…</h1>
  <p id="s">One moment.</p>
  <div class="card" id="c" hidden><p id="cp" style="margin:0"></p></div>
  <a class="btn" id="open" hidden>Return to Free to Take</a>
  <p class="muted" id="m" hidden>Open this link on the phone where the Free to Take app is installed. Links expire in 5 minutes and work once.</p>
</main>
<script>
(async () => {
  const q = new URLSearchParams(location.search), t = q.get('t') || '', p = q.get('p') || '';
  const $ = (id) => document.getElementById(id);
  const show = (title, sub, ok) => { $('t').textContent = title; $('s').textContent = sub; $('m').hidden = false; $('open').hidden = !ok; };
  // Custom-scheme fallback when Android App Links did not open the app directly. The token is NOT consumed here:
  // the app redeems it (single use) and sets the password.
  const deep = 'freetotake://auth/confirm?t=' + encodeURIComponent(t) + '&p=' + encodeURIComponent(p);
  $('open').href = /Android/i.test(navigator.userAgent)
    ? 'intent://auth/confirm?t=' + encodeURIComponent(t) + '&p=' + encodeURIComponent(p) + '#Intent;scheme=freetotake;package=app.freetotake;end'
    : deep;
  try {
    const r = await fetch('https://YOUR_PROJECT_REF.supabase.co/functions/v1/auth-email', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'check', token: t }) });
    const j = await r.json();
    if (j.ok) {
      show(j.purpose === 'recover' ? 'Link confirmed!' : 'Email verified!',
           j.purpose === 'recover' ? 'Return to the app to create a new password.' : 'Return to the app to continue and create your password.', true);
    } else if (j.error === 'LINK_EXPIRED') {
      show('This link has expired', 'Links are valid for 5 minutes. Open the app and request a new one.', false);
    } else if (j.error === 'LINK_USED') {
      show('This link was already used', 'Each link works once. Open the app and log in, or request a new link.', false);
    } else {
      show('This link is not valid', 'Open the app and request a new link.', false);
    }
  } catch (e) {
    show('Return to the app', 'We could not check the link here. Continue in the Free to Take app.', true);
  }
})();
</script>
</body></html>
